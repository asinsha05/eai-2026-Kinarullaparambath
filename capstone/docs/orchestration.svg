<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" font-family="Arial" font-size="12">
  <rect width="1000" height="320" fill="white"/>
  <circle cx="35" cy="90" r="16" fill="white" stroke="black"/>
  <text x="35" y="130" text-anchor="middle">order.accepted</text>
  <polygon points="100,90 125,65 150,90 125,115" fill="white" stroke="black"/>
  <text x="125" y="140" text-anchor="middle">b2b?</text>
  <rect x="190" y="65" width="110" height="50" rx="8" fill="white" stroke="black"/>
  <text x="245" y="95" text-anchor="middle">payment</text>
  <rect x="340" y="65" width="110" height="50" rx="8" fill="white" stroke="black"/>
  <text x="395" y="95" text-anchor="middle">inventory</text>
  <rect x="490" y="65" width="110" height="50" rx="8" fill="white" stroke="black"/>
  <text x="545" y="95" text-anchor="middle">shipping</text>
  <rect x="640" y="65" width="110" height="50" rx="8" fill="white" stroke="black"/>
  <text x="695" y="95" text-anchor="middle">notification</text>
  <circle cx="800" cy="90" r="14" fill="white" stroke="black" stroke-width="3"/>
  <text x="800" y="130" text-anchor="middle">completed</text>
  <line x1="51" y1="90" x2="99" y2="90" stroke="black"/>
  <line x1="150" y1="90" x2="189" y2="90" stroke="black"/>
  <line x1="300" y1="90" x2="339" y2="90" stroke="black"/>
  <line x1="450" y1="90" x2="489" y2="90" stroke="black"/>
  <line x1="600" y1="90" x2="639" y2="90" stroke="black"/>
  <line x1="750" y1="90" x2="785" y2="90" stroke="black"/>
  <text x="260" y="24" text-anchor="middle">b2b: no payment step</text>
  <rect x="340" y="230" width="110" height="40" rx="8" fill="white" stroke="black" stroke-dasharray="5 3"/>
  <text x="395" y="254" text-anchor="middle">inventory_release</text>
  <rect x="190" y="230" width="110" height="40" rx="8" fill="white" stroke="black" stroke-dasharray="5 3"/>
  <text x="245" y="254" text-anchor="middle">payment_refund</text>
  <text x="545" y="190" text-anchor="middle">error or timeout: compensate in reverse order</text>
