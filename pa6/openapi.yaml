openapi: 3.0.3
info:
  title: Checkout Orchestrator API
  version: 1.0.0
  description: >-
    Contract for the checkout orchestrator. POST /checkout accepts one
    canonical order and runs payment, inventory, shipping and notification
    in strict order. If a later step fails or times out, the completed steps
    that can be undone (inventory, then payment) are rolled back. The amount
    charged and the notification recipient are derived by the orchestrator
    from the order, never sent by the caller.
  contact:
    name: Checkout team
servers:
  - url: http://localhost:3000
    description: Local orchestrator started with docker compose.
tags:
  - name: checkout
    description: Checkout saga operations.
  - name: health
    description: Liveness operations.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: Reports whether the orchestrator is up and accepting requests.
      responses:
        "200":
          description: The orchestrator is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Run the checkout saga for one canonical order
      description: >-
        Runs payment, inventory, shipping and notification one after another
        for a single order. The amount is the sum of unitPrice times quantity
        over the items, sent to payment as a decimal string with two fraction
        digits. The recipient is customer.email. On failure or timeout the
        completed steps are compensated in reverse order (inventory release,
        then payment refund). Repeating a request with the same
        Idempotency-Key and the same body returns the first result without
        running the saga again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Client-chosen key for this checkout. The same key with the same
            body replays the first result. The same key with a different body
            is rejected with 409.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: The canonical order to check out. At most 50 items.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: All four steps succeeded and the saga status is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "400":
          description: The Idempotency-Key header is missing, or the body is not a valid canonical order (including more than 50 items).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The Idempotency-Key was already used with a different body
            (idempotency_payload_mismatch), or the first request with this
            key is still running (idempotency_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A step failed. Status is failed when payment failed or a
            compensation call failed (code compensation_failed), and
            compensated when a later step failed and the rollback succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "504":
          description: >-
            A downstream call did not answer within the request timeout.
            Status is failed when payment timed out, and compensated when a
            later step timed out and the rollback succeeded. The code is
            timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
components:
  schemas:
    HealthStatus:
      type: object
      description: Liveness payload.
      required: [status]
      properties:
        status:
          type: string
          description: Always ok when the orchestrator can serve requests.
          enum: [ok]
    Address:
      type: object
      description: Delivery address of the customer.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street and number.
          minLength: 1
        city:
          type: string
          description: City name.
          minLength: 1
        postalCode:
          type: string
          description: Postal code.
          minLength: 1
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code, for example LV.
    Customer:
      type: object
      description: The customer who placed the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Full name of the customer.
          minLength: 1
        email:
          type: string
          description: Email address. The notification is sent here.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: One line item of the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product identifier such as PROD-123.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Display name of the product.
          minLength: 1
        quantity:
          type: integer
          description: Number of units ordered.
          minimum: 1
        unitPrice:
          type: string
          description: Price of one unit as a decimal string with exactly two fraction digits, for example 22.50.
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
        currency:
          type: string
          description: Currency of the unit price.
        taxRate:
          type: number
          description: Tax as a fraction between 0 and 1, for example 0.21.
          minimum: 0
          maximum: 1
    CanonicalOrder:
      type: object
      description: The canonical order model shared by all assignments. It carries no amount and no recipient.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order id as given by the source system.
          minLength: 1
        orderType:
          type: string
          description: Business order type.
          enum: [standard, express, b2b]
        source:
          type: string
          description: Which translator produced the record.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          description: When the canonical record was produced, ISO-8601.
          format: date-time
        orderDate:
          type: string
          description: The order's own timestamp, ISO-8601 UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: Line items. At least 1 and at most 50, so one saga stays small enough to run and retry safely.
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Order-level currency.
        status:
          type: string
          description: Order status.
          enum: [new, processing, shipped, delivered]
    TraceItem:
      type: object
      description: One downstream call the saga made, in the order it made it.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: Which call this was.
          enum: [payment, inventory, shipping, notification, inventory_release, payment_refund]
        status:
          type: string
          description: Result of the call.
          enum: [success, failed, timeout]
        startedAt:
          type: string
          description: ISO-8601 time the call started.
          format: date-time
        finishedAt:
          type: string
          description: ISO-8601 time the call finished.
          format: date-time
        durationMs:
          type: integer
          description: Duration in whole milliseconds.
          minimum: 0
    CheckoutResult:
      type: object
      description: Outcome of one checkout saga.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The orderId from the request.
          minLength: 1
        status:
          type: string
          description: Final saga status.
          enum: [completed, failed, compensated]
        code:
          type: string
          description: Reason for a non-completed saga, such as payment_declined, timeout or compensation_failed.
        message:
          type: string
          description: Human-readable explanation, when available.
        trace:
          type: array
          description: Every call the saga made, compensations included. At most 6, because a saga has 4 steps and 2 compensations.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceItem"
    ErrorResponse:
      type: object
      description: Error body for validation and idempotency problems.
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable code such as validation_error, idempotency_payload_mismatch or idempotency_conflict.
          minLength: 1
        message:
          type: string
          description: Human-readable explanation for the developer calling the API.
          minLength: 1
